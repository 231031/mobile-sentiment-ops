name: Build Images

on:
  workflow_call:
    outputs:
      docker_tag:
        description: "Docker image tag (short SHA)"
        value: ${{ jobs.build.outputs.docker_tag }}

jobs:
  changes:
    name: Detect Changes
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      airflow: ${{ steps.changes.outputs.airflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changed paths
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            # Only rebuild images if source code or build workflow changes
            # Note: docker-compose.prod.yml is runtime config, not a build artifact
            # Changes to it only trigger redeployment, not rebuilds
            backend:
              - 'app/**'
              - '.github/workflows/build.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build.yml'
            # Airflow: Only rebuild when Dockerfile or dependencies change
            # Airflow DAGs/scripts are mounted as volumes - no rebuild needed for those!
            airflow:
              - 'airflow/Dockerfile.airflow'
              - 'airflow/dags/lib/requirements.txt'
              - '.github/workflows/build.yml'

  build:
    name: Build and Push Images
    needs: changes
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      docker_tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - name: Cleanup workspace
        run: |
          # Clean old docker images and containers before build
          docker image prune -af --filter "until=72h"
          docker container prune -f --filter "until=72h"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Docker tag (short SHA)
        id: set_tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Build and Push backend
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile.backend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}/mlops_mbs_backend:${{ steps.set_tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/mlops_mbs_backend:latest

      - name: Build and Push frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ github.repository }}/mlops_mbs_frontend:${{ steps.set_tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/mlops_mbs_frontend:latest

      - name: Build and Push Airflow
        if: needs.changes.outputs.airflow == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./airflow
          file: ./airflow/Dockerfile.airflow
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}/mlops_mbs_airflow:${{ steps.set_tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/mlops_mbs_airflow:latest
